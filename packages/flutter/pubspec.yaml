name: icon_monks
description: Icon Monks for Flutter. 1488 open source icons in thin, light, regular, bold and fill weights.
version: 0.2.0
homepage: https://designmonks.github.io/icon-monks/
repository: https://github.com/designmonks/icon-monks
topics:
  - icons
  - icon-font
  - svg
  - ui
  - design

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  fonts:
    - family: IconMonksThin
      fonts:
        - asset: fonts/IconMonks-Thin.otf
    - family: IconMonksLight
      fonts:
        - asset: fonts/IconMonks-Light.otf
    - family: IconMonksRegular
      fonts:
        - asset: fonts/IconMonks-Regular.otf
    - family: IconMonksBold
      fonts:
        - asset: fonts/IconMonks-Bold.otf
    - family: IconMonksFill
      fonts:
        - asset: fonts/IconMonks-Fill.otf
