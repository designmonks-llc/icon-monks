name: monks_icons
description: Monks Icons for Flutter. 97 open source icons in thin, light, regular, bold and fill weights.
version: 0.1.0
homepage: https://github.com/designmonks/monks-icons
repository: https://github.com/designmonks/monks-icons

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  fonts:
    - family: MonksIconsThin
      fonts:
        - asset: fonts/MonksIcons-Thin.otf
    - family: MonksIconsLight
      fonts:
        - asset: fonts/MonksIcons-Light.otf
    - family: MonksIconsRegular
      fonts:
        - asset: fonts/MonksIcons-Regular.otf
    - family: MonksIconsBold
      fonts:
        - asset: fonts/MonksIcons-Bold.otf
    - family: MonksIconsFill
      fonts:
        - asset: fonts/MonksIcons-Fill.otf
