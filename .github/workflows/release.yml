# Publishes a release when a version tag (v0.1.0) is pushed.
#   npm:      trusted publishing (OIDC), no token; each @icon-monks package trusts this repo's release.yml on npmjs.com
#   pub.dev:  needs automated publishing enabled for icon_monks on pub.dev and the PUB_AUTOMATED variable set to true
#   Swift:    nothing to do; SwiftPM resolves the tag directly
#   Android:  nothing to do; JitPack builds the tag on first request (see jitpack.yml)
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:   # Actions tab > Release > Run workflow: tags main with the package.json version

permissions:
  contents: write
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }   # no registry-url: its placeholder token would be tried before OIDC
      - run: npm install -g npm@latest   # trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10
      - name: Check the tag matches package versions
        if: github.event_name == 'push'
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Publish @icon-monks packages
        run: |
          for p in core react vue web font; do
            cd packages/$p
            spec="$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"
            # skip versions already on npm so a re-run after a partial failure finishes the rest
            if npm view "$spec" version >/dev/null 2>&1; then echo "$spec is already published"; else npm publish --access public; fi
            cd ../..
          done

  pub:
    if: vars.PUB_AUTOMATED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub publish --force
        working-directory: packages/flutter

  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the tag (if needed) and the GitHub release
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --target "$GITHUB_SHA" --generate-notes --title "Icon Monks $TAG"
        env:
          GH_TOKEN: ${{ github.token }}
