# Publishes a release when a version tag (v0.1.0) is pushed. The tag must point at a commit on main and match the
# version in package.json, or nothing is published.
#   npm:      trusted publishing (OIDC), no token; each @icon-monks package trusts this repo's release.yml on npmjs.com
#   pub.dev:  needs automated publishing enabled for icon_monks on pub.dev and the PUB_AUTOMATED variable set to true
#   Swift:    nothing to do; SwiftPM resolves the tag directly
#   Android:  nothing to do; JitPack builds the tag on first request (see jitpack.yml)
name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: The tag points at a commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$GITHUB_REF_NAME is not on main"; exit 1; }
      - name: The tag matches the package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME" || { echo "::error::$GITHUB_REF_NAME does not match package.json"; exit 1; }

  npm:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }   # no registry-url: its placeholder token would be tried before OIDC
      - run: npm install -g npm@latest   # trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10
      - name: Publish @icon-monks packages
        run: |
          for p in core react vue web font; do
            cd packages/$p
            spec="$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"
            # skip versions already on npm so a re-run after a partial failure finishes the rest
            if npm view "$spec" version >/dev/null 2>&1; then echo "$spec is already published"; else npm publish --access public; fi
            cd ../..
          done

  pub:
    needs: verify
    if: vars.PUB_AUTOMATED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub publish --force
        working-directory: packages/flutter

  github-release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub release unless `gh release create` already made it
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Icon Monks $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
