# Publishes a release when a version tag (v0.1.0) is pushed.
#   npm:      needs the NPM_TOKEN secret (an npm automation token with access to the @icon-monks scope)
#   pub.dev:  needs automated publishing enabled for icon_monks on pub.dev and the PUB_AUTOMATED variable set to true
#   Swift:    nothing to do; SwiftPM resolves the tag directly
#   Android:  nothing to do; JitPack builds the tag on first request (see jitpack.yml)
name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', registry-url: 'https://registry.npmjs.org' }
      - name: Check the tag matches package versions
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - name: Publish @icon-monks packages
        if: env.NODE_AUTH_TOKEN != ''
        run: for p in core react vue web font; do (cd packages/$p && npm publish --access public --provenance); done
      - name: Skip npm (no NPM_TOKEN secret)
        if: env.NODE_AUTH_TOKEN == ''
        run: echo "::warning::NPM_TOKEN is not set, npm packages were not published"

  pub:
    if: vars.PUB_AUTOMATED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub publish --force
        working-directory: packages/flutter

  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "Icon Monks $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
